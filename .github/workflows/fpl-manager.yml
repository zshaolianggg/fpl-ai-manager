name: FPL AI Manager

on:
  # GitHub's scheduler is retained as a backup. The primary clock can be an
  # external scheduler that invokes workflow_dispatch (see scheduler/cloudflare).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_report:
        description: "Optional: preview or final"
        required: false
        type: choice
        options: ["", "preview", "final"]
      trigger_source:
        description: "Optional trigger label (external/manual)"
        required: false
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  group: fpl-ai-manager
  cancel-in-progress: false

env:
  FPL_TEAM_ID: "6000549"
  FPL_TIMEZONE: "Asia/Shanghai"
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}
  FORCE_REPORT: ${{ inputs.force_report }}

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Scheduler diagnostics
        shell: bash
        run: |
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "event_name=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "actor=${{ github.actor }}"
          echo "trigger_source=${{ inputs.trigger_source || github.event_name }}"
          echo "force_report=${{ inputs.force_report }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Restore persistent manager state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state
            .cache
          key: fpl-manager-state-${{ github.run_id }}
          restore-keys: |
            fpl-manager-state-

      - name: Check whether a report is due
        id: preflight
        run: python -m fpl_ai_manager.preflight

      - name: Preflight diagnostics
        shell: bash
        run: |
          echo "due=${{ steps.preflight.outputs.due }}"
          echo "report_type=${{ steps.preflight.outputs.report_type }}"
          echo "gw=${{ steps.preflight.outputs.gw }}"
          echo "delivery_mode=${{ steps.preflight.outputs.delivery_mode }}"

      - name: Generate and email recommendation
        if: steps.preflight.outputs.due == 'true'
        timeout-minutes: 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_TYPE: ${{ steps.preflight.outputs.report_type }}
          DELIVERY_MODE: ${{ steps.preflight.outputs.delivery_mode }}
        run: python -m fpl_ai_manager.main

      - name: Save persistent manager state
        if: always() && steps.preflight.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .state
            .cache
          key: fpl-manager-state-${{ github.run_id }}
