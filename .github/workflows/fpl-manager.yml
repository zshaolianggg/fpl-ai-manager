name: FPL AI Manager

on:
  # Backup scheduler only.
  # Cloudflare Cron should be the primary scheduler and call workflow_dispatch.
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      force_report:
        description: "Optional: force a preview or final report"
        required: false
        type: choice
        options:
          - ""
          - preview
          - final

      trigger_source:
        description: "Who triggered this run"
        required: false
        type: string
        default: "manual"

permissions:
  contents: read

concurrency:
  group: fpl-ai-manager
  cancel-in-progress: false

env:
  FPL_TEAM_ID: "6000549"
  FPL_TIMEZONE: "Asia/Shanghai"
  OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5' }}

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Scheduler diagnostics
        shell: bash
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
          FORCE_REPORT_INPUT: ${{ inputs.force_report || '' }}
        run: |
          echo "utc_now=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "event_name=${{ github.event_name }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_attempt=${{ github.run_attempt }}"
          echo "actor=${{ github.actor }}"
          echo "trigger_source=${TRIGGER_SOURCE}"
          echo "force_report=${FORCE_REPORT_INPUT}"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FPL AI Manager
        run: pip install -e .

      - name: Restore persistent manager state
        uses: actions/cache/restore@v4
        with:
          path: |
            .state
            .cache
          key: fpl-manager-state-main-${{ github.run_id }}
          restore-keys: |
            fpl-manager-state-main-
            fpl-manager-state-

      - name: Check whether a report is due
        id: preflight
        env:
          FORCE_REPORT: ${{ inputs.force_report || '' }}
        run: python -m fpl_ai_manager.preflight

      - name: Preflight diagnostics
        shell: bash
        run: |
          echo "due=${{ steps.preflight.outputs.due }}"
          echo "report_type=${{ steps.preflight.outputs.report_type }}"
          echo "gw=${{ steps.preflight.outputs.gw }}"
          echo "delivery_mode=${{ steps.preflight.outputs.delivery_mode }}"

      - name: Generate and email recommendation
        if: steps.preflight.outputs.due == 'true'
        timeout-minutes: 20
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USE_TLS: ${{ secrets.SMTP_USE_TLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          REPORT_TYPE: ${{ steps.preflight.outputs.report_type }}
          DELIVERY_MODE: ${{ steps.preflight.outputs.delivery_mode }}
        run: python -m fpl_ai_manager.main

      - name: Save persistent manager state
        if: always() && steps.preflight.outputs.due == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .state
            .cache
          key: fpl-manager-state-main-${{ github.run_id }}